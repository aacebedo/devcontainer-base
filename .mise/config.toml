[settings]
experimental = true

[tools]
uv = "0.12.1"
node = "24.19.0"
markdownlint-cli2 = "0.23.0"
editorconfig-checker = "3.11.1"
hadolint = "2.15.1"
trivy = "0.74.0"
vale = "3.20.0"
yamllint = "1.38.0"
# taplo deactivated until their bug is fixed
# taplo = "0.10.0"
prek = "0.4.1"
shfmt = "3.13.0"
shellcheck = "0.11.0"
dprint = "0.56.1"
"pipx:checkov" = "3.3.1"
"github:cocogitto/cocogitto" = "7.0.0"
gh = "2.98.0"

[tools."npm:renovate"]
version = "44.39.2"
trust_policy_excludes = ["@yarnpkg/libzip"]

[vars]
# editorconfig-checker-disable
repo_host = '''{{ exec(command="git remote get-url origin 2>/dev/null | sed 's/[.]git$//' | awk -F'[/:]' '{print $(NF-2)}' | sed 's/.*@//' || echo ''") | trim }}'''
repo_owner = '''{{ exec(command="git remote get-url origin 2>/dev/null | sed 's/[.]git$//' | awk -F'[/:]' '{print $(NF-1)}' || echo ''") | trim }}'''
repo_name = '''{{ exec(command="git remote get-url origin 2>/dev/null | sed 's/[.]git$//' | awk -F'[/:]' '{print $NF}' || echo ''") | trim }}'''
# editorconfig-checker-enable
repo_url = "https://{{vars.repo_host}}/{{vars.repo_owner}}/{{vars.repo_name}}"
image_name = "ghcr.io/{{vars.repo_owner}}/{{vars.repo_name}}"
commit_sha = '''{{ exec(command="git rev-parse HEAD 2>/dev/null || echo ''") | trim }}'''

[bootstrap.packages]
"apt:bash" = "latest"
"apt:podman" = "latest"
"apt:fuse-overlayfs" = "latest"
"apt:iptables" = "latest"
"apt:build-essential" = "latest"
