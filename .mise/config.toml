min_version = "2026.10.6"
include = [
  "git::https://github.com/aacebedo/boilerplate-templates.git//static/mise/config/base.toml?ref=v0.7.0",
  "git::https://github.com/aacebedo/boilerplate-templates.git//static/mise/config/container.toml?ref=v0.7.0",
]

[vars]
image_description = "Alpine-based Docker image serving as a foundation for development containers"
image_licenses = "MIT"

[bootstrap.packages]
"apt:bash" = "latest"
"apt:podman" = "latest"
"apt:git" = "latest"

[task_config]
includes = [
  "git::https://github.com/aacebedo/boilerplate-templates.git//static/mise/tasks/base?ref=v0.7.0",
  "git::https://github.com/aacebedo/boilerplate-templates.git//static/mise/tasks/container?ref=v0.7.0",
  ".mise/tasks",
]

[settings]
experimental = true
