# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
# :schema https://www.schemastore.org/prek.json
#
[[repos]]
repo = "https://github.com/hadolint/hadolint"
rev = "v2.15.1"
hooks = [{ id = "hadolint" }]

[[repos]]
repo = "https://github.com/adrienverge/yamllint"
rev = "v1.38.0"
hooks = [{ id = "yamllint" }]

[[repos]]
repo = "https://github.com/editorconfig-checker/editorconfig-checker"
rev = "v4.0.1"
hooks = [{ id = "editorconfig-checker" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "trivy-fs"
name = "Trivy filesystem scan"
entry = "trivy"
args = ["fs", "."]
language = "system"
pass_filenames = false

[[repos]]
repo = "https://github.com/commitizen-tools/commitizen"
rev = "v4.18.0"
hooks = [{ id = "commitizen" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "vale-sync"
name = "Vale style sync"
# Syncs only when no style package is newer than .vale.ini (missing or stale).
entry = """
bash -c '
  [ -n "$(find .vale -mindepth 2 -maxdepth 2 -name meta.json -newer .vale.ini 2>/dev/null)" ] || vale sync
'
"""
language = "system"
pass_filenames = false
files = '(^|/)\.vale\.ini$|\.md$'

[[repos]]
repo = "https://github.com/errata-ai/vale"
rev = "v3.21.0"
hooks = [{ id = "vale" }]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "dprint"
name = "dprint check"
entry = "dprint check"
language = "system"
files = '\.(json|jsonc|ya?ml|md|toml)$|(^|/)Dockerfile$|\.dockerfile$'
pass_filenames = false

[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.5"
hooks = [
  { id = "tombi-lint", args = ["--offline"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "codebook"
name = "codebook spell check"
entry = "codebook-lsp lint"
language = "system"
files = '\.(md|toml|ya?ml|json|jsonc|sh)$|(^|/)Dockerfile$|\.dockerfile$'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "updatecli-manifest-validate"
name = "Validate Updatecli manifests"
entry = "env"
args = [
  "UPDATECLI_GITHUB_TOKEN=validate-only",
  "updatecli",
  "manifest",
  "validate",
  "--experimental",
  "--config",
  ".updatecli/manifests",
  "--values",
  ".updatecli/values.yaml",
]
language = "system"
files = '^\.updatecli/(manifests/.*\.ya?ml|values\.yaml)$'
pass_filenames = false

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.73"
hooks = [{ id = "rumdl-check" }]

[[repos]]
repo = "https://github.com/shellcheck-py/shellcheck-py"
rev = "v0.11.0.1"
hooks = [{ id = "shellcheck" }]

[[repos]]
repo = "https://github.com/scop/pre-commit-shfmt"
rev = "v3.14.1-1"
hooks = [{ id = "shfmt" }]

[[repos]]
repo = "https://github.com/bridgecrewio/checkov.git"
rev = "3.3.17"

[[repos.hooks]]
id = "checkov"
files = 'src/Dockerfile'

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cog-check"
name = "cog check"
entry = "cog"
args = ["check", "--from-latest-tag"]
language = "system"
pass_filenames = false
stages = ["pre-push"]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "biome-lint"
name = "biome lint"
entry = "biome lint --write --files-ignore-unknown=true --no-errors-on-unmatched"
language = "system"
files = '\.(js|jsx|mjs|cjs|ts|tsx|json|jsonc|css|html)$'
