{{- range $i, $dep := .miseDeps }}
{{- if $i }}
---
{{- end }}
name: "Bump {{ $dep.slug }} version in .mise/config.toml"

scms:
  default:
    kind: github
    spec:
      user: "{{ $.github.user }}"
      email: "{{ $.github.email }}"
      owner: "{{ $.github.owner }}"
      repository: "{{ $.github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      username: "{{ $.github.username }}"
      branch: "{{ $.github.branch }}"
      commitusingapi: true

sources:
  {{ $dep.slug }}:
    name: "Get latest {{ $dep.slug }} release"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
        pattern: '*'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}

targets:
  {{ $dep.slug }}:
    name: "Update {{ $dep.slug }} in .mise/config.toml"
    kind: file
    scmid: default
    sourceid: {{ $dep.slug }}
    spec:
      file: .mise/config.toml
      matchpattern: '(?m)^{{ $dep.tomlKey }} = ".*"$'
      replacepattern: '{{ $dep.tomlKey }} = "{{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}"'

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: 'chore(deps): bump {{ $dep.slug }} to {{ "{{" }} source "{{ $dep.slug }}" {{ "}}" }}'
    spec:
      labels:
        - dependencies
{{- end }}
