---
name: "Bump mise tool versions in .mise/config.toml"

scms:
  default:
    kind: github
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repository }}"
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      username: "{{ .github.username }}"
      branch: "{{ .github.branch }}"

sources:
{{- range $dep := .miseDeps }}
  {{ $dep.slug }}:
    name: "Get latest {{ $dep.slug }} release"
    kind: {{ $dep.kind }}
    spec:
  {{- if eq $dep.kind "githubrelease" }}
      owner: {{ $dep.owner }}
      repository: {{ $dep.repo }}
      token: '{{ requiredEnv "UPDATECLI_GITHUB_TOKEN" }}'
      versionfilter:
    {{- if $dep.versionfilterRegex }}
        kind: regex/semver
        regex: '{{ $dep.versionfilterRegex }}'
    {{- else }}
        kind: semver
    {{- end }}
  {{- else if eq $dep.kind "pypi" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: pep440
  {{- else if eq $dep.kind "npm" }}
      name: {{ $dep.name }}
      versionfilter:
        kind: semver
  {{- end }}
  {{- if or $dep.versionfilterRegex $dep.trimPrefix }}
    transformers:
  {{- if $dep.versionfilterRegex }}
      - findsubmatch:
          pattern: '{{ $dep.versionfilterRegex }}'
          captureindex: 1
  {{- end }}
  {{- if $dep.trimPrefix }}
      - trimprefix: "v"
  {{- end }}
  {{- end }}
{{- end }}

targets:
{{- range $dep := .miseDeps }}
  {{ $dep.slug }}:
    name: "Update {{ $dep.slug }} in .mise/config.toml"
    kind: toml
    scmid: default
    sourceid: {{ $dep.slug }}
    spec:
      file: .mise/config.toml
      engine: dasel/v3
      key: {{ $dep.daselKey }}
{{- end }}

actions:
  default:
    kind: github/pullrequest
    scmid: default
    title: "chore(deps): bump mise tool versions"
    spec:
      labels:
        - dependencies
