[[hooks.cd]]
run = '''
set -eu

[ -z "${MISE_PROJECT_ROOT:-}" ] && exit 0
[ "${MISE_SILENCE_STATUS_CHECKS:-0}" = "1" ] && exit 0

if ! mise bootstrap status --missing >/dev/null 2>&1; then
  printf '\e[33m[mise] Bootstrap not complete. Run: mise bootstrap\e[0m\n' >&2
fi
'''

[tasks.bootstrap]
hide = true
run = '''
set -eu

[ -z "${MISE_PROJECT_ROOT:-}" ] && exit 0
[ -d /etc/mise/bootstrap_scripts ] || exit 0

for script in /etc/mise/bootstrap_scripts/*; do
  [ -x "$script" ] || continue
  echo "Running $script"
  "$script"
done
'''
