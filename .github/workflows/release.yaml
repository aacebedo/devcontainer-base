---
name: Release
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
permissions: {}
jobs:
  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: write
      actions: read
      security-events: write
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ secrets.CI_ACTIONS_RELEASER_CLIENT_ID }}
          private-key: ${{ secrets.CI_ACTIONS_RELEASER_PRIVATE_KEY }}
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.generate-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true
      - name: Setup
        uses: ./.github/actions/setup
      - name: Configure git remote and user info
        shell: bash
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote set-url origin \
            "https://${REPO_OWNER}:${TOKEN}@github.com/${REPO}.git"
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ steps.generate-token.outputs.token }}
          REPO: ${{ github.repository }}
      - name: Perform release
        id: release
        run: |
          mise release
          echo "sarif=/tmp/trivy-results.sarif" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          CONTAINER_REGISTRY_USERNAME: ${{ github.repository_owner }}
          CONTAINER_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Anchore Scan SARIF Report
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: ${{ steps.release.outputs.sarif }}
