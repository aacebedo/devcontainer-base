---
name: PR

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  pr-checks:
    uses: aacebedo/boilerplate-templates/.github/workflows/reusable-pr-checks.yaml@v0.4.4
    permissions:
      contents: read
      packages: read
    with:
      extra-tasks: >-
        container:security-scan
