---
name: Setup
description: Sets up mise and configures git
runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4.3.0
      with:
        version: 2026.9.3
        bootstrap: true
    - name: Configure git safe directory
      shell: bash
      run: |
        git config --global --add safe.directory '*'
